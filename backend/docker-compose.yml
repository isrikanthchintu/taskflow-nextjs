services:
  mongo:
    image: mongo:7
    container_name: taskflow-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET:-rs0}
    command:
      - bash
      - -c
      - |
        openssl rand -base64 756 > /tmp/keyfile
        chmod 400 /tmp/keyfile
        chown mongodb:mongodb /tmp/keyfile
        exec docker-entrypoint.sh mongod --replSet "$${MONGO_REPLICA_SET}" --keyFile /tmp/keyfile --bind_ip_all
    volumes:
      - mongo-data:/data/db
      - ./docker/init-app-user.js:/docker-entrypoint-initdb.d/init-app-user.js:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id: process.env.MONGO_REPLICA_SET, members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

volumes:
  mongo-data:
